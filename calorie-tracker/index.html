<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tummy Pals</title>
  <meta name="description" content="A calorie tracker where logging your food feeds your own little virtual pet." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1 class="brand">Tummy Pals</h1>
        <p class="sub"><span id="petNameTop">Your pet</span> · Lv <span id="levelTop">1</span> · <span id="streak">🔥 0</span></p>
      </div>
      <button class="icon-btn" id="openSettings" aria-label="Pet settings">⚙️</button>
    </header>

    <!-- The pet's room -->
    <section class="room" id="room">
      <div class="window" aria-hidden="true"><span id="sky">☀️</span></div>
      <div class="frame" aria-hidden="true">🌷</div>
      <div class="floor" aria-hidden="true"></div>
      <div class="rug" aria-hidden="true"></div>
      <div class="bowl food-bowl" id="foodBowl" aria-hidden="true"><span>🍖</span></div>
      <div class="bowl water-bowl" id="waterBowl" aria-hidden="true"><span>💧</span></div>
      <div class="bubble" id="bubble" aria-hidden="true">🍙</div>
      <button class="pet-btn" id="petBtn" aria-label="Pet your pet">
        <svg class="pet" id="pet" viewBox="0 0 200 210" aria-hidden="true"></svg>
      </button>
      <div class="fx" id="fx" aria-hidden="true"></div>
    </section>
    <p class="speech" id="speech" aria-live="polite">…</p>

    <!-- Stats -->
    <section class="card stats">
      <div class="stat">
        <span class="stat-ico">🍖</span>
        <div class="stat-body">
          <div class="stat-top"><b>Tummy</b><span id="tummyText">0 / 2000 kcal</span></div>
          <div class="meter"><i id="tummyBar" class="tummy"></i></div>
        </div>
      </div>
      <div class="stat">
        <span class="stat-ico">💧</span>
        <div class="stat-body">
          <div class="stat-top"><b>Water</b><span id="waterText">0 / 8 cups</span></div>
          <div class="meter"><i id="waterBar" class="water"></i></div>
        </div>
      </div>
      <div class="stat">
        <span class="stat-ico">💖</span>
        <div class="stat-body">
          <div class="stat-top"><b>Happy</b><span id="happyText">0%</span></div>
          <div class="meter"><i id="happyBar" class="happy"></i></div>
        </div>
      </div>
      <div class="stat">
        <span class="stat-ico">⭐</span>
        <div class="stat-body">
          <div class="stat-top"><b>Level <span id="levelNum">1</span></b><span id="xpText">0 / 40 XP</span></div>
          <div class="meter"><i id="xpBar" class="xp"></i></div>
        </div>
      </div>
      <div class="cups" id="cups" aria-label="Water cups"></div>
    </section>

    <!-- Feed -->
    <section class="card">
      <h2>Feed <span id="petNameFeed">your pet</span></h2>
      <form id="addForm" class="add-form" autocomplete="off">
        <label class="field grow">
          <span>What did you eat?</span>
          <input id="foodName" type="text" maxlength="60" placeholder="e.g. paneer wrap" required />
        </label>
        <label class="field kcal-field">
          <span>kcal</span>
          <input id="foodKcal" type="number" inputmode="numeric" min="1" max="5000" placeholder="350" required />
        </label>
        <fieldset class="meals">
          <legend class="sr-only">Meal</legend>
          <label><input type="radio" name="meal" value="breakfast" /><span>🌅 Breakfast</span></label>
          <label><input type="radio" name="meal" value="lunch" /><span>☀️ Lunch</span></label>
          <label><input type="radio" name="meal" value="dinner" /><span>🌙 Dinner</span></label>
          <label><input type="radio" name="meal" value="snack" /><span>🍪 Snack</span></label>
        </fieldset>
        <button class="btn primary" type="submit">Feed 🍽️</button>
      </form>
      <p class="hint">Quick treats <span class="muted">(rough estimates)</span></p>
      <div class="chips" id="quickChips"></div>
    </section>

    <!-- Diary -->
    <section class="card">
      <div class="row-between">
        <h2>Diary</h2>
        <nav class="day-nav" aria-label="Choose day">
          <button class="mini-btn" id="prevDay" aria-label="Previous day">‹</button>
          <button class="day-label" id="dayLabel" title="Jump to today">Today</button>
          <button class="mini-btn" id="nextDay" aria-label="Next day">›</button>
        </nav>
      </div>
      <div class="week" id="week"></div>
      <div id="log"></div>
    </section>

    <!-- Wardrobe -->
    <section class="card">
      <div class="row-between">
        <h2>Wardrobe</h2>
        <span class="muted small">Level up to unlock</span>
      </div>
      <div class="wardrobe" id="wardrobe"></div>
    </section>

    <footer class="foot">Saved on this device only · Your pal loves you 🐾</footer>
  </main>

  <!-- Adopt / settings -->
  <dialog id="setup" class="dialog">
    <form method="dialog" id="setupForm">
      <h2 id="setupTitle">Adopt a pal!</h2>
      <div class="species" id="speciesPick" role="radiogroup" aria-label="Choose your pet"></div>
      <label class="field">
        <span>Name</span>
        <input id="petName" type="text" maxlength="16" required placeholder="Biscuit" />
      </label>
      <label class="field">
        <span>Daily calorie goal</span>
        <input id="goalInput" type="number" inputmode="numeric" min="800" max="6000" step="50" required />
      </label>
      <div class="dialog-actions">
        <button class="btn" value="cancel" id="setupCancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="save">Let's go 🐾</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
